# Included by every location that serves the SPA. (add_header in a location replaces inherited ones,
# which is why this is an include rather than a single server-level block.)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# $hsts is empty unless the request arrived over HTTPS (see the map in default.conf); nginx omits empty headers.
add_header Strict-Transport-Security $hsts always;
