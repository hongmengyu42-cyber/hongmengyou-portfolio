# One address for everything: the React app, the API and the SEO/sitemap endpoints. nginx never talks to the
# database, and the backend is not reachable from the internet; only this server is.

# --- Who is a trusted proxy? Only Docker/private networks (e.g. the Caddy HTTPS container). If your hosting
# --- platform's load balancer lives in a different range, add it here.
geo $realip_remote_addr $trusted_proxy {
    default         0;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    127.0.0.0/8     1;
}
# "https" only if a trusted proxy said so. A visitor cannot fake it by sending the header themselves.
map "$trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    "1:https" "https";
    default   "http";
}
map $forwarded_proto $hsts {
    "https" "max-age=31536000; includeSubDomains";
    default "";
}
# Original path without the query string; handed to the backend to build page-specific SEO tags.
map $request_uri $seo_path {
    "~^(?<p>[^?]*)" $p;
    default         "/";
}

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 6m;            # matches the backend's 6 MB multipart limit

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS. Re-resolving "backend" keeps nginx working when the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript image/svg+xml application/xml;

    # ---- API: proxied to Spring Boot. The backend sets its own security headers, so none are added here. ----
    location ^~ /api/ {
        limit_req zone=api burst=60 nodelay;
        set $backend http://backend:8080;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 120s;        # "Check all links" can take a while
        proxy_pass $backend$request_uri;
    }

    location = /sitemap.xml {
        set $backend http://backend:8080;
        include /etc/nginx/proxy-common.conf;
        proxy_pass $backend$request_uri;
    }
    location = /robots.txt {
        set $backend http://backend:8080;
        include /etc/nginx/proxy-common.conf;
        proxy_pass $backend$request_uri;
    }

    # ---- Used only by the SSI include inside index.html. Not reachable from outside (internal). ----
    location = /__seo_head {
        internal;
        set $backend http://backend:8080;
        include /etc/nginx/proxy-common.conf;
        proxy_set_header Accept-Encoding "";    # SSI cannot splice compressed fragments
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;                  # slow backend: give up quickly and use the static fallback
        proxy_pass $backend/api/v1/seo/head$is_args$args;
    }

    # ---- Never expose operational endpoints or dotfiles ----
    location ^~ /actuator { return 404; }
    location ~ /\.       { return 404; }

    # ---- Static build output. File names contain a content hash, so they can be cached "forever". ----
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location = /theme-init.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /favicon.svg {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
    # A missing file with an asset extension is a real 404, not the app shell.
    location ~* \.(?:js|mjs|css|map|woff2?|png|jpe?g|webp|svg|ico|txt|json)$ {
        try_files $uri =404;
    }

    # ---- The admin area: same app shell, but keep it out of search engines ----
    location ^~ /admin {
        ssi on;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # ---- Everything else is the single-page app. index.html is never cached, so a new deploy shows at once. ----
    location / {
        ssi on;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
